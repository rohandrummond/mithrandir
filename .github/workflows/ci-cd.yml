name: CI/CD

# Triggers
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'compose.prod.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'compose.prod.yaml'

# Env variables
env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: mithrandir-api
  EC2_HOST: 52.63.178.8

jobs:

  # Run .NET integration tests
  test:
    name: Run tests
    runs-on: ubuntu-latest

    # Set up Postgres & Redis on runner
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: mithrandir_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d mithrandir_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Clone repo on runner, install .NET and run tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Run tests
        run: dotnet test --verbosity normal
        env:
          ConnectionStrings__MithrandirDb: Host=localhost;Port=5432;Database=mithrandir_test;Username=test;Password=test
          ConnectionStrings__MithrandirRedis: localhost:6379


  # Build .NET API image for ECR
  build:
    name: Build and push to ECR
    runs-on: ubuntu-latest
    needs: test
    # Disabled while AWS infrastructure is torn down, restore the condition below to re-enable
    # if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    if: false

    steps:

      # Clone repo on runner
      - name: Checkout code
        uses: actions/checkout@v4

      # Authenticate AWS
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Authenticate ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Install Docker BuildX (for building in required EC2 format - ARM64)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Push image to ECR (specific in tags)
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest,${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy on EC2 via Docker Compose
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    # Disabled while AWS infrastructure is torn down, restore the condition below to re-enable
    # if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    if: false

    steps:

      # Authenticate AWS
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Get ECR password to pass to EC2
      - name: Get ECR login password
        id: ecr-password
        run: echo "password=$(aws ecr get-login-password --region ${{ env.AWS_REGION }})" >> $GITHUB_OUTPUT

      # SSH into EC2 instance
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Authenticate EC2
            echo "${{ steps.ecr-password.outputs.password }}" | docker login --username AWS --password-stdin 322906267612.dkr.ecr.ap-southeast-2.amazonaws.com

            # Get latest image from ECR and restart
            cd ~
            docker compose pull
            docker compose up -d

            # Clean up old images
            docker image prune -f

            # Health check
            sleep 10
            curl -f http://localhost/health/live || exit 1
