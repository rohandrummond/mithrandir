services:

  # .NET API 
  api:
    # Pull from ECR
    image: 322906267612.dkr.ecr.ap-southeast-2.amazonaws.com/mithrandir-api:latest

    # Map EC2 port 80 (HTTP) to container port 8080 (.NET)
    ports:
      - "80:8080"

    # Environment variables
    environment:
      # Postgres
      - ConnectionStrings__MithrandirDb=Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      # Redis
      - ConnectionStrings__MithrandirRedis=redis:6379
      # Admin key
      - AdminApiKey=${AdminApiKey}
      # CORS for Vercel Dashboard
      - CORS_ORIGINS=${CORS_ORIGINS}
      # Set .NET environment to prod
      - ASPNETCORE_ENVIRONMENT=Production

    # Wait for Postgres and Redis before starting
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    # Automatically restart if the container crashes
    restart: unless-stopped

    # Health checks
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 30s       
      timeout: 10s        
      retries: 3         
      start_period: 10s 

  # Postgres
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

# Data volumes for Postgres and Redis
volumes:
  postgres_data:
  redis_data: